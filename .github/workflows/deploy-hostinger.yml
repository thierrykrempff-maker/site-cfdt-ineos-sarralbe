name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Publier sur Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agents/**
            **/.claude/**
            agents/**
            docs/**
            knowledge/**
            methodology/**
            private/**
            confidential/**
            reports/**
            scripts/**
            public/**
            templates/**
            README.md
            run-nexus-tests.bat
            cfdt-home-*.png
            hostinger-upload-*/**
            hostinger-upload-*.zip
            .gitignore
